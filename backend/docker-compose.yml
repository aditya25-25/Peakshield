version: '3.9'

services:
  api:
    build: .
    container_name: peakshield-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/peakshield
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgis/postgis:16-3.4
    container_name: peakshield-db
    environment:
      POSTGRES_DB: peakshield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: peakshield-redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
